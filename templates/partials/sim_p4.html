<div class="answer-zone" data-exercise-id="{{ ex.id }}" data-part="4">
  {% if ex.example %}
    <div class="card example-card">
      <span class="badge">Esempio</span>
      <p class="example-text">{{ ex.example }}</p>
    </div>
  {% endif %}

  <div class="headline-strip">
    {% for h in ex.headlines %}
      <span class="headline-chip"><strong>{{ h.key }}</strong> · {{ h.text }}</span>
    {% endfor %}
  </div>

  <h3 class="section-label">Notizie — scegli il titolo più adatto</h3>
  <div class="news-list">
    {% for item in ex.news %}
      <div class="news-item">
        <span class="profile-number">{{ item.number }}</span>
        <p class="news-text">{{ item.text }}</p>
        <label class="sr-only" for="sim-{{ ex.id }}-news-{{ item.number }}">Titolo per la notizia {{ item.number }}</label>
        <select id="sim-{{ ex.id }}-news-{{ item.number }}" name="{{ item.number }}" class="select">
          <option value="">Scegli un titolo…</option>
          {% for h in ex.headlines %}
            <option value="{{ h.key }}">{{ h.key }} — {{ h.text }}</option>
          {% endfor %}
        </select>
      </div>
    {% endfor %}
  </div>
</div>

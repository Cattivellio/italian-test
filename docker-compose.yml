services:
  italian-test:
    build: .
    container_name: italian-test
    ports:
      - "8050:8050"
    environment:
      - TZ=Europe/Rome
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - ADMIN_PHONE=${ADMIN_PHONE:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-Amministratore}
      - DB_HOST=postgres_central
      - DB_PORT=5432
      - DB_NAME=italian_test
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
    restart: unless-stopped

networks:
  default:
    name: postgree_red_central_db
    external: true

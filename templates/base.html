<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>IMPAROMA · Pratica B1</title>
  <meta name="description" content="IMPAROMA: esercizi di lettura per prepararsi alla sezione Leggere della certificazione PLIDA B1." />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="IMPAROMA" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-inner">
        <a href="/practice" class="brand" aria-label="Vai alla home">
          <img class="brand-logo" src="/static/img/imparoma-mark.png" alt="IMPAROMA" />
          <span class="brand-name"><strong>IMPAROMA</strong></span>
        </a>
        {% if current_user %}
          <a href="/profile" class="profile-badge" aria-label="Il tuo profilo">
            <span class="profile-avatar" aria-hidden="true">{{ current_user.name[:1]|upper if current_user.name else current_user.phone[:1] }}</span>
          </a>
        {% endif %}
      </div>
    </header>

    <main class="main" id="main">
      {% block content %}{% endblock %}
    </main>

    <nav class="bottom-bar" aria-label="Navigazione principale">
      <a href="/practice" class="bottom-tab {{ 'active' if active_tab == 'practice' else '' }}">
        <span class="tab-icon" aria-hidden="true">📚</span>
        <span class="tab-label">Allenamento</span>
      </a>
      <a href="/simulation" class="bottom-tab {{ 'active' if active_tab == 'simulation' else '' }}">
        <span class="tab-icon" aria-hidden="true">⏱️</span>
        <span class="tab-label">Simulazione</span>
      </a>
      <a href="/vocab" class="bottom-tab {{ 'active' if active_tab == 'vocab' else '' }}">
        <span class="tab-icon" aria-hidden="true">📖</span>
        <span class="tab-label">Vocabolario</span>
      </a>
    </nav>
  </div>

  <div class="sheet-overlay" id="sheet-overlay" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Scegli un'opzione" hidden>
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-body" id="sheet-body"></div>
    <button class="btn btn-ghost sheet-close" type="button" data-sheet-close>Chiudi</button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>

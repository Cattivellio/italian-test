<div class="answer-zone" data-exercise-id="{{ ex.id }}" data-part="1">
  <article class="card passage-card">
    <p class="passage-text">{{ ex.text }}</p>
  </article>
  <p class="question">{{ ex.question }}</p>
  <div class="option-list" role="radiogroup" aria-label="Scegli una risposta">
    {% for opt in ex.options %}
      <label class="option sim-option" for="sim-{{ ex.id }}-{{ opt.key }}">
        <input type="radio" class="sr-only" id="sim-{{ ex.id }}-{{ opt.key }}" name="sim-{{ ex.id }}" value="{{ opt.key }}" />
        <span class="option-key">{{ opt.key }}</span>
        <span class="option-text">{{ opt.text }}</span>
      </label>
    {% endfor %}
  </div>
</div>

<section class="hero">
  <span class="badge">Parte 1{% if ex.topic %} · {{ ex.topic }}{% endif %}</span>
  <h1>{{ ex.title }}</h1>
</section>

<article class="card passage-card">
  <h2 class="sr-only">{{ ex.title }}</h2>
  <p class="passage-text">{{ ex.text }}</p>
</article>

<div id="answer-{{ ex.id }}" class="answer-zone" data-exercise-id="{{ ex.id }}" data-part="1">
  <p class="question">{{ ex.question }}</p>
  <div class="option-list">
    {% for opt in ex.options %}
      <button type="button" class="option"
        hx-post="/answer"
        hx-vals='{"exercise_id": "{{ ex.id }}", "answer": "{{ opt.key }}"}'
        hx-target="#answer-{{ ex.id }}"
        hx-swap="innerHTML"
        hx-disabled-elt="this">
        <span class="option-key">{{ opt.key }}</span>
        <span class="option-text">{{ opt.text }}</span>
      </button>
    {% endfor %}
  </div>
  {% include 'partials/keywords_block.html' %}
</div>
